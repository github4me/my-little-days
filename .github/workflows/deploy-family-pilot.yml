name: Deploy family API and database

# No push, merge, release, schedule, or workflow_run deployment trigger.
on:
  workflow_dispatch:
    inputs:
      database_bootstrapped:
        description: SQL identities and runtime role are bootstrapped; I reviewed this release's SQL changes
        type: boolean
        required: true
        default: false
      adopt_ef:
        description: Adopt a reviewed existing database with legacy EF history (leave false for a new database)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize the entire release with infrastructure apply (including SQL firewall changes).
  group: family-infrastructure
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require reviewed current trusted-branch revision and SQL bootstrap
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_SHA: ${{ github.sha }}
          DATABASE_BOOTSTRAPPED: ${{ inputs.database_bootstrapped }}
          TRUSTED_BRANCH: ${{ vars.FAMILY_INFRA_BRANCH || github.event.repository.default_branch }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('The workflow commit SHA is invalid.');
            core.info(`Automatically selected release commit: ${sha}`);
            if (process.env.DATABASE_BOOTSTRAPPED !== 'true') throw new Error('Complete the one-time SQL bootstrap and review migrations first.');
            if (context.ref !== `refs/heads/${process.env.TRUSTED_BRANCH}`) throw new Error('Run the workflow from the trusted release branch.');
            const current = await github.rest.git.getRef({ ...context.repo, ref: `heads/${process.env.TRUSTED_BRANCH}` });
            if (current.data.object.sha !== sha || context.sha !== sha) throw new Error('This run is stale. Start a new run from the trusted release branch.');

  verify:
    needs: validate
    uses: ./.github/workflows/family-pilot-ci.yml
    with:
      revision: ${{ github.sha }}

  migrate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: family-database
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_DB_MIGRATION_CLIENT_ID: ${{ vars.AZURE_DB_MIGRATION_CLIENT_ID }}
      FAMILY_DB_RESOURCE_GROUP: ${{ vars.FAMILY_DB_RESOURCE_GROUP }}
      FAMILY_DB_SERVER_NAME: ${{ vars.FAMILY_DB_SERVER_NAME }}
      FAMILY_DB_NAME: ${{ vars.FAMILY_DB_NAME }}
      FAMILY_DB_MIGRATIONS_ENABLED: ${{ vars.FAMILY_DB_MIGRATIONS_ENABLED }}
      TRUSTED_BRANCH: ${{ vars.FAMILY_INFRA_BRANCH || github.event.repository.default_branch }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: family-database-${{ github.run_id }}
          path: artifacts/database
      - name: Recheck approved revision and show only federation binding claims
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            if (process.env.FAMILY_DB_MIGRATIONS_ENABLED !== 'true') throw new Error('Configure and protect family-database before enabling migrations.');
            const current = await github.rest.git.getRef({ ...context.repo, ref: `heads/${process.env.TRUSTED_BRANCH}` });
            if (current.data.object.sha !== process.env.RELEASE_SHA) throw new Error('Approval is stale; review the new release.');
            const token = await core.getIDToken('api://AzureADTokenExchange');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            core.info(JSON.stringify({ issuer: claims.iss, subject: claims.sub, audience: claims.aud }));
      - uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        id: azure-login
        with:
          client-id: ${{ vars.AZURE_DB_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply DbUp with temporary exact runner-IP access
        shell: pwsh
        env:
          ADOPT_EF: ${{ inputs.adopt_ef }}
        run: ./infra/github-database.ps1 -Mode Migrate -AdoptEf:($env:ADOPT_EF -ceq 'true')
      - name: Recover this run's firewall cleanup
        if: ${{ always() && steps.azure-login.outcome == 'success' }}
        shell: pwsh
        run: ./infra/github-database.ps1 -Mode Cleanup

  deploy:
    # Failed SQL or cleanup blocks API deployment. No automatic schema rollback.
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: family-pilot
      url: ${{ vars.FAMILY_API_PUBLIC_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Keep this existing environment/flag and its OIDC subject stable across upgrades.
      - name: Require configured protected family environment
        shell: bash
        env:
          ENABLED: ${{ vars.FAMILY_PILOT_DEPLOY_ENABLED }}
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
          PUBLIC_URL: ${{ vars.FAMILY_API_PUBLIC_URL }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          [ "$ENABLED" = true ] || { echo 'Configure and protect the family-pilot environment before enabling deployment.' >&2; exit 1; }
          for value in "$WEBAPP" "$PUBLIC_URL" "$CLIENT_ID" "$TENANT_ID" "$SUBSCRIPTION_ID"; do
            [ -n "$value" ] || { echo 'A required family API environment variable is missing.' >&2; exit 1; }
          done
          [[ "$PUBLIC_URL" == https://* ]] || { echo 'The family API URL must use HTTPS.' >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: family-api-${{ github.run_id }}
          path: family-api
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: family-api
      - name: Check public liveness only
        shell: bash
        env:
          PUBLIC_URL: ${{ vars.FAMILY_API_PUBLIC_URL }}
        run: |
          # Shared B1 cold starts can take several minutes after zip deployment finishes.
          curl --fail --silent --show-error --retry 60 --retry-delay 5 --retry-max-time 300 --retry-all-errors \
            --connect-timeout 10 --max-time 20 "${PUBLIC_URL%/}/health/live"
